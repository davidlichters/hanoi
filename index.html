"GOI DUDU",17000,"Goi du du green papaya salad.jpg","MAIN COURSES","Green Papaya Salad","Julienned green papaya, fresh herbs, and a tangydressing. Typically topped with crushed peanuts, driedshrimp, or crispy shallots, it offers a perfect balance oftextures—crunchy, chewy, and tender.",,"Regular","Classique","Normal","Normale","Обычный","Salade de papaye verte","Papaye verte en julienne, herbes fraîches et vinaigrette acidulée. Généralement garnie de cacahuètes concassées, crevettes séchées ou échalotes croustillantes, offrant un parfait équilibre de textures — croquant, moelleux et tendre.","Ensalada de papaya verde","Papaya verde en juliana, hierbas frescas y un aderezo ácido. Normalmente cubierto con cacahuetes triturados, camarones secos o chalotes crujientes, ofrece un equilibrio perfecto de texturas: crujiente, masticable y tierno.","Insalata di papaya verde","Papaya verde julienne, erbe fresche e una salsa agrodolce. Tipicamente guarnito con arachidi tritate, gamberetti secchi o scalogno croccante, offre un perfetto equilibrio di texture — croccante, morbido e tenero.","Салат из зеленой папайи","Нарезанная соломкой зеленая папайя, свежие травы и пикантная заправка. Обычно сверху посыпают дроблеными арахисом, сушеными креветками или хрустящим луком-шалотом, создавая идеальный баланс текстур — хрустящая, эластичная и нежная."

"COM DAU PHU SOT CÀ CHUA",28000,"Tofu in tomato sauce.jpg","MAIN COURSES","Tofu in Tomato Sauce","Crispy tofu simmered in a savory and slightly tangytomato sauce. The tofu absorbs the rich flavors ofgarlic, onions, and ripe tomatoes, creating aperfect balance of taste and texture.This is a perfect Vegan dish that we eat at homewithout being vegan",,,,,,,"Tofu à la sauce tomate","Tofu croustillant mijoté dans une sauce tomate savoureuse et légèrement acidulée. Le tofu absorbe les riches saveurs d’ail, d’oignons et de tomates mûres, créant un parfait équilibre de goût et de texture. C’est un plat végan parfait que nous mangeons à la maison sans être végans.","Tofu en salsa de tomate","Tofu crujiente cocido en una salsa de tomate sabrosa y ligeramente ácida. El tofu absorbe los ricos sabores de ajo, cebolla y tomates maduros, creando un equilibrio perfecto de sabor y textura. Este es un plato vegano perfecto que comemos en casa sin ser veganos","Tofu in salsa di pomodoro","Tofu croccante cotto lentamente in una salsa di pomodoro saporita e leggermente acidula. Il tofu assorbe i ricchi sapori di aglio, cipolle e pomodori maturi, creando un perfetto equilibrio di gusto e consistenza. Questo è un piatto vegano perfetto che mangiamo a casa senza essere vegani.","Тофу в томатном соусе","Хрустящий тофу, тушенный в пикантном и слегка кисленьком томатном соусе. Тофу впитывает богатый вкус чеснока, лука и спелых помидоров, создавая идеальный баланс вкуса и текстуры. Это идеальное веганское блюдо, которое мы едим дома, не будучи веганами"

"BÒ LÚC LAC",30000,"Shaking beef.jpg","MAIN COURSES","Shaking Beef","Soft and tender beef fillet cubes marinated in 3Vietnamese sauces for at least one hour priorcooking. Then we ""Shake"" it in a high heat wok withveggies. Served with steamed rice, Mango, saladand Egg.",,,,,,,"Bœuf sauté","Morceaux tendres de filet de bœuf marinés dans 3 sauces vietnamiennes pendant au moins une heure avant cuisson. Puis nous les « secouons » dans un wok à feu vif avec des légumes. Servis avec riz vapeur, mangue, salade et œuf.","Shaking Beef","Trozos suaves de filete de res marinados en 3 salsas vietnamitas durante al menos una hora antes de cocinarlos. Luego los ""sacudimos"" en un wok a alta temperatura con verduras. Servido con arroz al vapor, mango, ensalada y huevo.","Shaking Beef","Morbidi cubetti di filetto di manzo marinati in 3 salse vietnamite per almeno un'ora prima della cottura. Poi vengono ""scossi"" in un wok a fuoco alto con verdure. Serviti con riso al vapore, mango, insalata e uovo.","Взбитое мясо","Нежные и мягкие кубики говяжьего филе, маринованные в 3 вьетнамских соусах как минимум один час перед приготовлением. Затем мы обжариваем их в воке на сильном огне с овощами. Подается с паровым рисом, манго, салатом и яйцом."
"PHO BÒ",33000,"Beef noodle soup.jpg","MAIN COURSES","Beef Noodle","Beef broth simmered 24 hours with 5 Vietnamesespices and served with Flat Rice Noodles, ThinSlices of Beef fillet, spring onion & herbsThe most iconic Vietnamese dish of them all, Pho. It's considered Vietnam's national dish.",0,"Regular","Classique","Normal","Normale","Обычный","Soupe de nouilles au bœuf","Bouillon de bœuf mijoté pendant 24 heures avec 5 épices vietnamiennes et servi avec des nouilles de riz plates, de fines tranches de filet de bœuf, oignons verts et herbes. Le plat vietnamien le plus emblématique, le Pho. Considéré comme le plat national du Vietnam.","Sopa de fideos con ternera","Caldo de res cocido durante 24 horas con 5 especias vietnamitas y servido con fideos planos de arroz, finas lonchas de filete de res, cebolla de verdeo y hierbas El plato vietnamita más icónico de todos, Pho. Se considera el plato nacional de Vietnam.","Zuppa di noodles di manzo","Brodo di manzo cotto per 24 ore con 5 spezie vietnamite e servito con noodles di riso piatti, sottili fette di filetto di manzo, cipollotto e erbe aromatiche Il piatto vietnamita più iconico di tutti, Pho. È considerato il piatto nazionale del Vietnam.","Суп с говяжьей лапшой","Говяжий бульон, варенный 24 часа с 5 вьетнамскими специями, подается с плоской рисовой лапшой, тонкими ломтиками филе говядины, зеленым луком и травами. Самое знаковое вьетнамское блюдо — Фо. Считается национальным блюдом Вьетнама."

"PHO GÀ",33000,"Chicken noodle soup.jpg","MAIN COURSES","Chicken Noodle Soup","An more easy going Noodle Soup but not lessaromatic . In contrast with Pho bo which takelonger time to cook and usually we only go to Phorestaurant to eat, Pho ga is an easier version thatwe can cook at home. This is actually my Dad’sfavorite breakfast.",,,,,,,"Soupe de nouilles au poulet","Une soupe de nouilles plus simple mais tout aussi aromatique. Contrairement au Pho bo qui prend plus de temps à cuire et que nous mangeons généralement seulement au restaurant, le Pho ga est une version plus facile que nous cuisinons à la maison. C’est en fait le petit-déjeuner préféré de mon père.","Sopa de fideos con pollo","Una sopa de fideos más sencilla pero no menos aromática. En contraste con el Pho bo, que tarda más tiempo en cocinarse y normalmente solo vamos a un restaurante de Pho para comer, el Pho ga es una versión más fácil que podemos cocinar en casa. Este es en realidad el desayuno favorito de mi papá.","Zuppa di noodles di pollo","Una zuppa di noodles più semplice ma non meno aromatica. Al contrario del Pho bo, che richiede più tempo per cuocere e di solito si mangia solo nei ristoranti Pho, il Pho ga è una versione più facile da cucinare a casa. Questa è in realtà la colazione preferita di mio padre.","Суп с куриной лапшой","Более легкий суп с лапшой, но не менее ароматный. В отличие от Pho bo, который готовится дольше и который обычно едят только в ресторане Фо, Pho ga — это более простая версия, которую мы можем приготовить дома. На самом деле это любимый завтрак моего папы."
"BÚN THIT NUONG",29000,"Cold noodle bowl with grilled chicken.jpg","MAIN COURSES","Cold Noodle Soup with Grilled Chicken","Round rice noodles with grilled meat whichoriginated from Southern Vietnam, is a popularCold rice noodles topped with grilled chickenspring roll fresh herbs, roasted peanut, pickledcarrot, cucumber and served with light, sweeten fish sauce",,,,,,,"Soupe froide de nouilles au poulet grillé","Nouilles de riz rondes avec viande grillée, originaires du sud du Vietnam, plat populaire Nouilles de riz froides garnies de poulet grillé, rouleau de printemps, herbes fraîches, cacahuètes grillées, carottes marinées, concombre et servies avec une sauce de poisson douce et légère.","Sopa fría de fideos con pollo a la parrilla","Fideos de arroz redondos con carne a la parrilla originarios del sur de Vietnam, muy populares Fideos de arroz fríos cubiertos con pollo a la parrilla, rollitos frescos, hierbas, cacahuetes tostados, zanahoria encurtida, pepino y servidos con salsa de pescado ligera y dulce","Zuppa fredda di noodles con pollo alla griglia","Noodles di riso rotondi con carne alla griglia originari del Vietnam meridionale, un piatto popolare. Noodles di riso freddi con pollo alla griglia, involtino primavera, erbe fresche, arachidi tostate, carote e cetrioli sottaceto, serviti con una leggera salsa di pesce dolce","Холодный суп с лапшой и курицей-гриль","Круглая рисовая лапша с жареным мясом, родом из Южного Вьетнама, популярное блюдо. Холодная рисовая лапша с жареной курицей, спринг-роллом, свежими травами, жареным арахисом, маринованной морковью, огурцом и подается с легким сладким рыбным соусом"
"MIE XÀO",28000,"Stir-fried glass noodle chicken.jpg","MAIN COURSES","Stir-fried Glass Noodle","Glass Noodles are typical transparent noodlesmade of starch (in our menu its Mung bean starch)considered as the most healthy noodle (low cab,gluten-free)",,"Regular","Classique","Normal","Normale","Обычный","Nouilles de verre sautées","Les nouilles de verre sont des nouilles transparentes typiques faites d’amidon (dans notre menu, amidon de haricot mungo) considérées comme les plus saines (pauvres en glucides, sans gluten)","Fideos de cristal salteados","Fideos de vidrio son fideos transparentes típicos hechos de almidón (en nuestro menú es almidón de frijol mungo), considerados los fideos más saludables (bajos en carbohidratos, sin gluten)","Noodles di vetro saltati","Noodles di vetro sono noodles trasparenti tipici fatti di amido (nel nostro menu è amido di fagioli mung) considerati i noodles più sani (basso contenuto di carboidrati, senza glutine)","Стеклянная лапша","Стеклянная лапша — это прозрачная лапша, сделанная из крахмала (в нашем меню из крахмала мунг-боб), считается самой здоровой лапшой (низкоуглеводная, без глютена)"

"THAI",29000,"Thai drunken noodle chicken.jpg","MAIN COURSES","Drunken Noodle","Yes, it is Thai foods. But we love Thai foodsanyways and Hanoi House Cafe in Paje has madethis dish exceptionally good. We made our own EggNoodle. Please ask for Rice noodle if you needGluten-free",,"Regular","Classique","Normal","Normale","Обычный","Nouilles ivres","Oui, c’est un plat thaï. Mais nous aimons la cuisine thaï et le Hanoi House Café à Paje a rendu ce plat exceptionnellement bon. Nous avons fait nos propres nouilles aux œufs. Demandez des nouilles de riz si vous avez besoin sans gluten.","Fideos borrachos","Sí, es comida tailandesa. Pero nos encanta la comida tailandesa de todos modos y Hanoi House Café en Paje ha hecho este plato excepcionalmente bueno. Hicimos nuestros propios fideos de huevo. Por favor, pide fideos de arroz si necesitas sin gluten","Noodles ubriachi","Sì, è cucina thailandese. Ma amiamo comunque i cibi thailandesi e l’Hanoi House Cafe a Paje ha reso questo piatto eccezionale. Abbiamo preparato i nostri noodles all’uovo. Chiedi i noodles di riso se hai bisogno di senza glutine","Пьяная лапша","Да, это тайская кухня. Но мы все равно любим тайскую еду, и Hanoi House Cafe в Падже приготовил это блюдо исключительно хорошо. Мы сделали свою яичную лапшу. Пожалуйста, попросите рисовую лапшу, если нужна безглютеновая версия"

"BÁNH XÈO",28000,"Banx xeo.jpg","MAIN COURSES","Banx xeo","is a crispy Vietnamese rice flour crepe filled with asavory mix of shrimp, and bean sprouts. Goldenand crunchy, it’s typically served with fresh herbs,lettuce, and a tangy dipping sauce.Eaten by wrapping pieces of the pancake inlettuce or rice paper, Bánh Xèo offers a perfectbalance of textures and flavors",,"Regular","Classique","Normal","Normale","Обычный","Banh xeo","C’est une crêpe vietnamienne croustillante à base de farine de riz, garnie d’un mélange savoureux de crevettes et de germes de soja. Dorée et croustillante, elle est généralement servie avec des herbes fraîches, de la laitue et une sauce de trempage acidulée. On la mange en enroulant des morceaux de crêpe dans de la laitue ou du papier de riz, le Bánh Xèo offre un parfait équilibre de textures et de saveurs.","Banh xeo","Es un crujiente crepe vietnamita de harina de arroz relleno con una mezcla sabrosa de camarones y brotes de soja. Dorado y crujiente, normalmente se sirve con hierbas frescas, lechuga y una salsa ácida. Se come envolviendo trozos del panqueque en lechuga o papel de arroz, Bánh Xèo ofrece un equilibrio perfecto de texturas y sabores","Banh xeo","È una crêpe vietnamita croccante fatta con farina di riso, ripiena di un mix saporito di gamberi e germogli di soia. Dorata e croccante, viene tipicamente servita con erbe fresche, lattuga e una salsa agrodolce. Si mangia avvolgendo i pezzi della crêpe nella lattuga o nella carta di riso; Bánh Xèo offre un perfetto equilibrio di consistenze e sapori","Булочки Бань-сео","Хрустящий вьетнамский блин из рисовой муки, наполненный пикантной смесью креветок и проростков фасоли. Золотистый и хрустящий, обычно подается со свежими травами, салатом и кисловатым соусом. Едят, заворачивая кусочки блина в салат или рисовую бумагу, Bánh Xèo предлагает идеальный баланс текстур и вкусов"

function parseCSV(csvText) {
  const lines = csvText.trim().split('\n').filter(l => l.trim() !== '');
  const headers = parseCSVLine(lines[0]);

  const rows = lines.slice(1).map(line => {
    const cols = parseCSVLine(line);
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = cols[i] !== undefined ? cols[i].trim() : '';
    });
    return obj;
  });

  // Helpers
  const normCategory = (s) =>
    (s || '').toString().trim().replace(/\s+/g, ' ').toUpperCase();

  const normKey = (s) =>
    (s || '')
      .toString()
      .normalize('NFKD')                // разложить буквы с диакритиками
      .replace(/[\u0300-\u036f]/g, '')  // убрать диакритики
      .replace(/[^A-Za-z0-9]+/g, '')    // оставить только буквы/цифры
      .toUpperCase();

  const groupedByCategory = {};
  const productIndex = {}; // productKey -> product (для объединения)

  rows.forEach(item => {
    const catKey = normCategory(item.category || 'UNCATEGORIZED');
    if (!groupedByCategory[catKey]) groupedByCategory[catKey] = [];

    // Базовое имя для ключа: en_name -> vietnam_name -> photo+desc
    const baseName = item.en_name || item.vietnam_name || (item.photo + '|' + item.en_description) || 'ITEM';
    const productKey = `${catKey}::${normKey(baseName)}`;

    if (!productIndex[productKey]) {
      const product = {
        vietnam_name: item.vietnam_name || '',
        photo: item.photo || '',
        category: catKey, // уже нормализовано, дубликатов ключа не будет
        en_name: item.en_name || '',
        en_description: item.en_description || '',
        fr_name	: item.fr_name || '',
        fr_description: item.fr_description || '',
        fr_variants: item.fr_variants || '',
        es_name: item.es_name || '',
        es_description: item.es_description || '',
        es_variants: item.es_variants || '',
        it_name: item.it_name || '',
        it_description: item.it_description || '',
        it_variants: item.it_variants || '',
        ru_name: item.ru_name || '',
        ru_description: item.ru_description || '',
        ru_variants: item.ru_variants || '',
        price: item.price ? Number(item.price) : null,
        options: [],
        engl_options: []
      };
      // временно для дедупликации опций
      product._optSet = new Set();
      product._engl_optSet = new Set();
      productIndex[productKey] = product;
      groupedByCategory[catKey].push(product);
    }

    const product = productIndex[productKey];

    // Заполняем недостающие поля из следующих строк того же продукта
    if (!product.photo && item.photo) product.photo = item.photo;
    if (!product.vietnam_name && item.vietnam_name) product.vietnam_name = item.vietnam_name;
    if (!product.en_name && item.en_name) product.en_name = item.en_name;
    if (!product.en_description && item.en_description) product.en_description = item.en_description;
    if (product.price == null && item.price) product.price = Number(item.price);

    // Добавляем вариант (опцию) 
    // const opt = (item.en_variants || '').trim();currentLang
    const opt = (item[currentLang + '_variants'] || '').trim();
    const engl_opt = (item.en_variants || '').trim();
    if (opt && !product._optSet.has(opt)) {
      product._optSet.add(opt);
      product.options.push(opt);
    }
	
    if (engl_opt && !product._engl_optSet.has(engl_opt)) {
      product._engl_optSet.add(engl_opt);
      product.engl_options.push(engl_opt);
    }
  });

  // Чистим служебные поля
  Object.values(groupedByCategory).forEach(products => {
    products.forEach(p => delete p._optSet);
    products.forEach(p => delete p._engl_optSet);
  });

  return { headers, groupedByCategory };
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (char === '"') {
      if (inQuotes && line[i + 1] === '"') {
        current += '"';
        i++; // skip escaped quote
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === ',' && !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current);

  // Remove trailing empty columns (optional)
  while (result.length && result[result.length - 1] === '') {
    result.pop();
  }

  return result;
}

  });
  $("cats").innerHTML = nav; $("list").innerHTML = html; upd();
  $("lang").hidden = true; $("menu").hidden = false; window.scrollTo(0, 0);
}
$("list").addEventListener("click", e => {
  const z = e.target.closest("[data-z]"); if (z) { $("zimg").src = z.dataset.z; $("zoom").hidden = false; return }
  const b = e.target.closest(".st button"); if (!b) return;
  const st = b.parentNode, k = st.dataset.k, n = Math.max(0, (counts[k] || 0) + (b.classList.contains("pl") ? 1 : -1));
  counts[k] = n; st.querySelector("b").textContent = n; st.classList.toggle("z", !n); upd();
});
function upd() { const n = Object.values(counts).reduce((a, b) => a + b, 0); $("wcount").textContent = n; $("wcount").hidden = !n }
$("wbtn").addEventListener("click", () => {
  const rows = [];
  items.forEach((it, id) => {
    const parts = it.opts.map((v, vi) => [v, counts[id + "|" + vi] || 0]).filter(x => x[1]);
    if (!parts.length) return;
    const total = parts.reduce((a, x) => a + x[1], 0);
    const det = parts.filter(x => x[0][1]).map(x => `${x[0][1]} × ${x[1]}`).join(", ");
    rows.push(`<div class="wi"><strong>${total} × ${esc(it.en)}</strong><small>${esc(it.vn)}${det ? " · " + esc(det) : ""}</small></div>`);
  });
  $("wlist").innerHTML = rows.join("") || `<div class="empty">Nothing selected yet.</div>`;
  $("ov").hidden = false;
});
$("close").addEventListener("click", () => $("ov").hidden = true);
$("ov").addEventListener("click", e => { if (e.target.id === "ov") $("ov").hidden = true });
$("zoom").addEventListener("click", () => { $("zoom").hidden = true; $("zimg").src = "" });
$("back").addEventListener("click", () => { $("menu").hidden = true; $("lang").hidden = false; window.scrollTo(0, 0) });
$("cats").addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault();
  const t = document.querySelector(a.getAttribute("href")); if (t) window.scrollTo({top: t.getBoundingClientRect().top + scrollY - 104, behavior: "smooth"}) });
addEventListener("scroll", () => {
  $("fx").classList.toggle("on", scrollY > 2);
  let cur = null; document.querySelectorAll("#list .sh").forEach(h => { if (h.getBoundingClientRect().top < 140) cur = h.id });
  document.querySelectorAll("#cats a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + cur));
}, {passive: true});
</script>
</body></html>
